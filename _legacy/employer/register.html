<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đăng ký Nhà tuyển dụng — Stujob</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/employer.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card" style="max-width:600px;">
    <div class="auth-logo" style="background:linear-gradient(135deg,#0ea5e9,#6366f1);">🏢</div>
    <h1>Tạo tài khoản NTD</h1>
    <p class="subtitle">Chọn loại tài khoản để bắt đầu</p>
    <div id="alert" class="alert"></div>

    <!-- ============ CHỌN LOẠI ============ -->
    <div class="loai-grid">
      <div class="loai-card" data-loai="ca_nhan">
        <div class="lc-icon">👤</div>
        <div class="lc-label">Cá nhân</div>
      </div>
      <div class="loai-card" data-loai="ho_kinh_doanh">
        <div class="lc-icon">🏪</div>
        <div class="lc-label">Hộ kinh doanh</div>
      </div>
      <div class="loai-card active" data-loai="doanh_nghiep">
        <div class="lc-icon">🏢</div>
        <div class="lc-label">Doanh nghiệp</div>
      </div>
    </div>

    <!-- ============ KHỐI OCR ============ -->
    <div class="ocr-box emp">
      <div class="ocr-head">
        <span class="ocr-icon">📷</span>
        <div style="flex:1;">
          <div style="font-weight:700; font-size:14px;" id="ocr_title">Quét mã số thuế (tùy chọn)</div>
          <div class="text-muted" style="font-size:12px;" id="ocr_desc">
            Upload ảnh giấy phép/CCCD → tự động điền thông tin
          </div>
        </div>
      </div>
      <label for="ocr_file" class="btn btn-sm btn-outline" style="cursor:pointer;">📤 Chọn ảnh</label>
      <input type="file" id="ocr_file" accept="image/*" hidden aria-label="Ảnh định danh">
      <div id="ocr_preview" class="ocr-preview"></div>
      <div id="ocr_status" class="ocr-status"></div>
      <div id="ocr_raw" class="ocr-raw hidden"></div>
    </div>

    <!-- ============ FORM ============ -->
    <form id="regForm">
      <input type="hidden" name="loai" id="reg_loai" value="doanh_nghiep">

      <div class="form-group">
        <label for="reg_ten" id="label_ten">Tên doanh nghiệp *</label>
        <input id="reg_ten" name="ten_cong_ty" class="form-control" required placeholder="Công ty TNHH ABC">
      </div>

      <div class="form-2col">
        <div class="form-group">
          <label for="reg_email">Email *</label>
          <input id="reg_email" type="email" name="email" class="form-control" required autocomplete="email" placeholder="hr@company.vn">
        </div>
        <div class="form-group">
          <label for="reg_pass">Mật khẩu * (≥6 ký tự)</label>
          <input id="reg_pass" type="password" name="mat_khau" class="form-control" required minlength="6" autocomplete="new-password">
        </div>
      </div>

      <div class="form-group" id="grp_mst">
        <label for="reg_mst">Mã số thuế *</label>
        <input id="reg_mst" name="ma_so_thue" class="form-control" placeholder="VD: 0123456789">
      </div>
      <div class="form-group hidden" id="grp_hkd">
        <label for="reg_hkd">Mã số hộ kinh doanh *</label>
        <input id="reg_hkd" name="ma_so_hkd" class="form-control" placeholder="VD: 12A3456789">
      </div>
      <div class="form-group hidden" id="grp_cccd">
        <label for="reg_cccd">Số CCCD * (12 số)</label>
        <input id="reg_cccd" name="cccd" class="form-control" placeholder="12 số" maxlength="12">
      </div>

      <div class="form-2col">
        <div class="form-group">
          <label for="reg_daidien">Người đại diện</label>
          <input id="reg_daidien" name="nguoi_dai_dien" class="form-control" placeholder="Nguyễn Văn A">
        </div>
        <div class="form-group">
          <label for="reg_sdt">Số điện thoại</label>
          <input id="reg_sdt" name="so_dien_thoai" class="form-control" placeholder="09xx xxx xxx">
        </div>
      </div>

      <div class="form-group">
        <label for="reg_diachi">Địa chỉ</label>
        <input id="reg_diachi" name="dia_chi" class="form-control" placeholder="Số 1, đường ABC, Hà Nội">
      </div>

      <div class="form-group">
        <label for="reg_linhvuc">Lĩnh vực hoạt động</label>
        <input id="reg_linhvuc" name="linh_vuc" class="form-control" placeholder="VD: CNTT, F&B, Giáo dục">
      </div>

      <button type="submit" class="btn btn-emp btn-block" id="btnReg">Đăng ký</button>
    </form>

    <div class="auth-footer">Đã có tài khoản? <a href="login.html">Đăng nhập</a></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="../assets/js/ocr.js"></script>
<script>
const alertEl = document.getElementById('alert');
const showAlert = (m, t = 'error') => {
  alertEl.className = 'alert show alert-' + t;
  alertEl.textContent = m;
};

/* ============ CHỌN LOẠI TÀI KHOẢN ============ */
let currentType = 'doanh_nghiep';
function updateTypeUI() {
  document.querySelectorAll('.loai-card').forEach(c =>
    c.classList.toggle('active', c.dataset.loai === currentType));
  document.getElementById('reg_loai').value = currentType;

  const labelTen = document.getElementById('label_ten');
  const grpMst = document.getElementById('grp_mst');
  const grpHkd = document.getElementById('grp_hkd');
  const grpCccd = document.getElementById('grp_cccd');
  const ocrTitle = document.getElementById('ocr_title');
  const ocrDesc = document.getElementById('ocr_desc');

  grpMst.classList.add('hidden');
  grpHkd.classList.add('hidden');
  grpCccd.classList.add('hidden');

  if (currentType === 'ca_nhan') {
    labelTen.textContent = 'Họ và tên *';
    document.getElementById('reg_ten').placeholder = 'Nguyễn Văn A';
    grpCccd.classList.remove('hidden');
    ocrTitle.textContent = 'Quét CCCD (tùy chọn)';
    ocrDesc.textContent = 'Upload ảnh CCCD → tự động điền số CCCD, họ tên, địa chỉ';
  } else if (currentType === 'ho_kinh_doanh') {
    labelTen.textContent = 'Tên hộ kinh doanh *';
    document.getElementById('reg_ten').placeholder = 'Hộ KD Trà Sữa ABC';
    grpHkd.classList.remove('hidden');
    ocrTitle.textContent = 'Quét mã số hộ kinh doanh (tùy chọn)';
    ocrDesc.textContent = 'Upload ảnh giấy phép hộ KD → tự động điền mã số';
  } else {
    labelTen.textContent = 'Tên doanh nghiệp *';
    document.getElementById('reg_ten').placeholder = 'Công ty TNHH ABC';
    grpMst.classList.remove('hidden');
    ocrTitle.textContent = 'Quét mã số thuế (tùy chọn)';
    ocrDesc.textContent = 'Upload ảnh giấy phép ĐKKD → tự động điền mã số thuế';
  }
}
document.querySelectorAll('.loai-card').forEach(c => {
  c.addEventListener('click', () => {
    currentType = c.dataset.loai;
    updateTypeUI();
  });
});
updateTypeUI();

/* ============ OCR ============ */
const ocrInput = document.getElementById('ocr_file');
const ocrStatus = document.getElementById('ocr_status');
const ocrPreview = document.getElementById('ocr_preview');
const ocrRaw = document.getElementById('ocr_raw');

ocrInput.addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) return;

  ocrPreview.innerHTML = `<img src="${URL.createObjectURL(f)}" alt="Ảnh định danh">`;
  ocrStatus.className = 'ocr-status';
  ocrStatus.innerHTML = '⏳ Đang tải công cụ OCR... (lần đầu 30-60s)';

  try {
    const { raw, parsed } = await OCR.scanEmployer(f, currentType, pct => {
      ocrStatus.innerHTML = `⏳ Đang nhận dạng... ${pct}%<div class="ocr-progress"><div style="width:${pct}%"></div></div>`;
    });

    const setIf = (id, val) => {
      if (!val) return false;
      const el = document.getElementById(id);
      if (el && !el.value.trim()) { el.value = val; return true; }
      return false;
    };

    let filled = 0;
    if (setIf('reg_ten', parsed.ten)) filled++;
    if (setIf('reg_mst', parsed.ma_so_thue)) filled++;
    if (setIf('reg_hkd', parsed.ma_so_hkd)) filled++;
    if (setIf('reg_cccd', parsed.cccd)) filled++;
    if (setIf('reg_daidien', parsed.nguoi_dai_dien)) filled++;
    if (setIf('reg_diachi', parsed.dia_chi)) filled++;

    ocrRaw.textContent = raw;
    ocrRaw.classList.remove('hidden');

    if (filled === 0) {
      ocrStatus.className = 'ocr-status error';
      ocrStatus.innerHTML = '⚠️ Không trích xuất được. Vui lòng nhập tay.';
    } else {
      ocrStatus.className = 'ocr-status success';
      ocrStatus.innerHTML = `✅ Đã quét & điền ${filled} trường. Vui lòng kiểm tra và sửa nếu cần.`;
    }
  } catch (err) {
    console.error(err);
    ocrStatus.className = 'ocr-status error';
    ocrStatus.innerHTML = '❌ Lỗi OCR: ' + err.message;
  }
});

/* ============ SUBMIT ============ */
document.getElementById('regForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('btnReg');
  btn.disabled = true;
  btn.textContent = 'Đang xử lý...';
  const payload = Object.fromEntries(new FormData(e.target).entries());

  try {
    const r = await fetch('../api/employer/auth.php?action=register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const j = await r.json();
    if (j.success) {
      showAlert('Đăng ký thành công! Đang chuyển hướng...', 'success');
      setTimeout(() => location.href = 'login.html', 900);
    } else {
      showAlert(j.message);
      btn.disabled = false;
      btn.textContent = 'Đăng ký';
    }
  } catch (err) {
    showAlert('Lỗi kết nối');
    btn.disabled = false;
    btn.textContent = 'Đăng ký';
  }
});
</script>
</body>
</html>
