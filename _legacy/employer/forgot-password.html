<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quên mật khẩu — Stujob</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/employer.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo" style="background:linear-gradient(135deg,#0ea5e9,#6366f1);">🔑</div>
    <h1>Quên mật khẩu</h1>
    <p class="subtitle">Nhập email để nhận link đặt lại mật khẩu</p>
    <div id="alert" class="alert"></div>
    <form id="fForm">
      <div class="form-group">
        <label for="fp_email">Email tài khoản</label>
        <input id="fp_email" type="email" name="email" class="form-control" required autocomplete="email" placeholder="hr@company.vn">
      </div>
      <button type="submit" class="btn btn-emp btn-block" id="btnF">Gửi yêu cầu</button>
    </form>
    <div class="auth-footer"><a href="login.html">← Về trang đăng nhập</a></div>
  </div>
</div>
<script>
const alertEl = document.getElementById('alert');
const showAlert = (m, t = 'error') => {
  alertEl.className = 'alert show alert-' + t;
  alertEl.innerHTML = m;
};
document.getElementById('fForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('btnF');
  btn.disabled = true;
  btn.textContent = 'Đang gửi...';
  const payload = Object.fromEntries(new FormData(e.target).entries());
  try {
    const r = await fetch('../api/employer/auth.php?action=forgot', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const j = await r.json();
    if (j.success) {
      showAlert(`✅ ${j.message}<br><br><a href="${j.reset_link}"><b>👉 Nhấn vào đây để đặt lại mật khẩu</b></a>`, 'success');
    } else {
      showAlert(j.message);
    }
  } catch (err) {
    showAlert('Lỗi kết nối');
  }
  btn.disabled = false;
  btn.textContent = 'Gửi yêu cầu';
});
</script>
</body>
</html>
