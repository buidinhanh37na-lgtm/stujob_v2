<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đăng nhập Nhà tuyển dụng — Stujob</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/employer.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo" style="background:linear-gradient(135deg,#0ea5e9,#6366f1);">🏢</div>
    <h1>Nhà tuyển dụng</h1>
    <p class="subtitle">Đăng nhập để quản lý tin việc & ứng viên</p>
    <div id="alert" class="alert"></div>
    <form id="loginForm">
      <div class="form-group">
        <label for="lg_email">Email</label>
        <input id="lg_email" type="email" name="email" class="form-control" required autocomplete="email" placeholder="hr@company.vn">
      </div>
      <div class="form-group">
        <label for="lg_pass">Mật khẩu</label>
        <input id="lg_pass" type="password" name="mat_khau" class="form-control" required autocomplete="current-password" placeholder="••••••">
      </div>
      <button type="submit" class="btn btn-emp btn-block" id="btnLogin">Đăng nhập</button>
    </form>
    <div class="auth-links">
      <a href="forgot-password.html">Quên mật khẩu?</a>
      <a href="register.html">Tạo tài khoản</a>
    </div>
    <div class="auth-footer">Bạn là sinh viên? <a href="../login.html">Đăng nhập tại đây</a></div>
  </div>
</div>
<script>
const alertEl = document.getElementById('alert');
const showAlert = (m, t = 'error') => {
  alertEl.className = 'alert show alert-' + t;
  alertEl.textContent = m;
};
document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('btnLogin');
  btn.disabled = true;
  btn.textContent = 'Đang đăng nhập...';
  const payload = Object.fromEntries(new FormData(e.target).entries());
  try {
    const r = await fetch('../api/employer/auth.php?action=login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const j = await r.json();
    if (j.success) {
      showAlert('Đăng nhập thành công!', 'success');
      setTimeout(() => location.href = 'dashboard.html', 500);
    } else {
      showAlert(j.message);
      btn.disabled = false;
      btn.textContent = 'Đăng nhập';
    }
  } catch (err) {
    showAlert('Lỗi kết nối máy chủ');
    btn.disabled = false;
    btn.textContent = 'Đăng nhập';
  }
});
</script>
</body>
</html>
