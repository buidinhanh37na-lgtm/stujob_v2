<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đặt lại mật khẩu — Stujob</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/employer.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo" style="background:linear-gradient(135deg,#0ea5e9,#6366f1);">🔒</div>
    <h1>Đặt lại mật khẩu</h1>
    <p class="subtitle">Nhập mật khẩu mới của bạn</p>
    <div id="alert" class="alert"></div>
    <form id="rForm">
      <div class="form-group">
        <label for="rp_pass">Mật khẩu mới (≥6 ký tự)</label>
        <input id="rp_pass" type="password" name="mat_khau" class="form-control" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-emp btn-block" id="btnR">Đổi mật khẩu</button>
    </form>
  </div>
</div>
<script>
const p = new URLSearchParams(location.search);
const token = p.get('token') || '';
const alertEl = document.getElementById('alert');
const showAlert = (m, t = 'error') => {
  alertEl.className = 'alert show alert-' + t;
  alertEl.textContent = m;
};
document.getElementById('rForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('btnR');
  btn.disabled = true;
  btn.textContent = 'Đang xử lý...';
  const payload = Object.fromEntries(new FormData(e.target).entries());
  payload.token = token;
  try {
    const r = await fetch('../api/employer/auth.php?action=reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const j = await r.json();
    showAlert(j.message, j.success ? 'success' : 'error');
    if (j.success) {
      setTimeout(() => location.href = 'login.html', 1200);
    } else {
      btn.disabled = false;
      btn.textContent = 'Đổi mật khẩu';
    }
  } catch (err) {
    showAlert('Lỗi kết nối');
    btn.disabled = false;
    btn.textContent = 'Đổi mật khẩu';
  }
});
</script>
</body>
</html>
