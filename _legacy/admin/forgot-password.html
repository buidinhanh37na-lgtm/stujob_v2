<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quên mật khẩu Admin — Stujob</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
<div class="admin-auth-wrap">
  <div class="admin-auth-card">
    <div class="auth-logo">🔑</div>
    <h1>Quên mật khẩu</h1>
    <p class="subtitle">Nhập email để nhận link đặt lại mật khẩu</p>
    <div id="alert" class="alert"></div>
    <form id="fForm">
      <div class="form-group">
        <label for="fp_email">Email admin</label>
        <input id="fp_email" type="email" name="email" class="form-control" required autocomplete="email" placeholder="admin@stujob.vn">
      </div>
      <button type="submit" class="btn btn-adm btn-block" id="btnF">Gửi yêu cầu</button>
    </form>
    <div class="auth-links">
      <a href="login.html">← Về trang đăng nhập</a>
    </div>
  </div>
</div>
<script>
const alertEl = document.getElementById('alert');
document.getElementById('fForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('btnF');
  btn.disabled = true; btn.textContent = 'Đang gửi...';
  const payload = Object.fromEntries(new FormData(e.target).entries());
  try {
    const r = await fetch('../api/admin/auth.php?action=forgot', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const j = await r.json();
    alertEl.className = 'alert show alert-' + (j.success ? 'success' : 'error');
    if (j.success) {
      alertEl.innerHTML = `✅ ${j.message}<br><br><a href="${j.reset_link}"><b>👉 Nhấn vào đây để đặt lại mật khẩu</b></a>`;
    } else {
      alertEl.textContent = j.message;
    }
  } catch (err) {
    alertEl.className = 'alert show alert-error';
    alertEl.textContent = 'Lỗi kết nối';
  }
  btn.disabled = false; btn.textContent = 'Gửi yêu cầu';
});
</script>
</body>
</html>
