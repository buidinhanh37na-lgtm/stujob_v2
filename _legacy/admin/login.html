<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đăng nhập Admin — Stujob</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
<div class="admin-auth-wrap">
  <div class="admin-auth-card">
    <div class="auth-logo">🛡️</div>
    <h1>Quản trị hệ thống</h1>
    <p class="subtitle">Stujob Admin Portal</p>
    <div id="alert" class="alert"></div>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" name="email" class="form-control" required placeholder="admin@stujob.vn" autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Mật khẩu</label>
        <input id="password" type="password" name="mat_khau" class="form-control" required placeholder="••••••" autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-adm btn-block" id="btnLogin">Đăng nhập</button>
    </form>
    <div class="auth-links">
      <a href="forgot-password.html">Quên mật khẩu?</a>
      <a href="../index.html">Về trang chủ</a>
    </div>
    <div class="auth-footer" style="font-size:12px;color:#94a3b8;text-align:center;margin-top:16px;">
      🔒 Chỉ dành cho quản trị viên
    </div>
  </div>
</div>
<script>
const alertEl = document.getElementById('alert');
const showAlert = (m, t = 'error') => {
  alertEl.className = 'alert show alert-' + t;
  alertEl.textContent = m;
};
document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('btnLogin');
  btn.disabled = true; btn.textContent = 'Đang xác thực...';
  const payload = Object.fromEntries(new FormData(e.target).entries());
  try {
    const r = await fetch('../api/admin/auth.php?action=login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const j = await r.json();
    if (j.success) {
      showAlert('Đăng nhập thành công!', 'success');
      setTimeout(() => location.href = 'dashboard.html', 500);
    } else {
      showAlert(j.message);
      btn.disabled = false; btn.textContent = 'Đăng nhập';
    }
  } catch (err) {
    showAlert('Lỗi kết nối');
    btn.disabled = false; btn.textContent = 'Đăng nhập';
  }
});
</script>
</body>
</html>
